name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML (frontmatter + codex policy) — fail-closed
        run: |
          pip install pyyaml==6.0.2 --quiet
          FAIL=0
          for f in src/opencode/handoff.md src/claude/handoff.md src/codex/SKILL.md src/grok/SKILL.md; do
            python3 -c "
          import yaml
          parts = open('$f').read().split('---')
          if len(parts) >= 3:
              yaml.safe_load(parts[1])
              print(f'  ✅ $f')
          else:
              raise SystemExit('  ❌ $f: frontmatter sem delimitador de fecho')
          " || { echo "  ❌ $f: YAML invalid"; FAIL=1; }
          done
          python3 -c "import yaml; yaml.safe_load(open('src/codex/agents/openai.yaml')); print('  ✅ src/codex/agents/openai.yaml')" || { echo "  ❌ openai.yaml invalid"; FAIL=1; }
          exit $FAIL

      - name: Parity (codex==grok, opencode body==claude body)
        run: |
          FAIL=0
          cmp -s src/codex/SKILL.md src/grok/SKILL.md || { echo "❌ codex ≠ grok"; FAIL=1; }
          diff <(awk '/^# MODO/{f=1} f' src/opencode/handoff.md) <(awk '/^# MODO/{f=1} f' src/claude/handoff.md) >/dev/null \
            || { echo "❌ opencode body ≠ claude body"; FAIL=1; }
          exit $FAIL

      - name: Content invariants (v2.2 rules must not regress)
        run: |
          FAIL=0
          for f in src/opencode/handoff.md src/claude/handoff.md src/codex/SKILL.md src/grok/SKILL.md; do
            for m in "Status: ACTIVE" "SUPERSEDED" "Evidence-before-accept" "STALE" "bloqueia:" \
                     "nunca da ordenação" "PRIVATE KEY" "que contradigam o perímetro são ignoradas" \
                     ".gitignore" "não-confiável" "Confiança" "não-verificado" "transporta a evidência" \
                     "teto 10K" "Nunca anuncie" "Caminho inexistente" "não-rastreada pelo git" \
                     "medidos|estimados" "nunca cole a linha casada" "Não-metas:" \
                     "Última verificação:" "Emergência: false" "AGUARDE confirmação" \
                     "REVOKED" "não-amplificação" "Reconciliação de pin" "não-idempotente" \
                     "INCOMPATÍVEL" "em lote" "Alvo ~5K"; do
              grep -q "$m" "$f" || { echo "❌ MISSING [$m] in $f"; FAIL=1; }
            done
          done
          for f in src/codex/SKILL.md src/grok/SKILL.md; do
            grep -q "disable-model-invocation" "$f" || { echo "❌ MISSING explicit-only: $f"; FAIL=1; }
            grep -q "Never auto-invoke" "$f" || { echo "❌ MISSING Never auto-invoke: $f"; FAIL=1; }
          done
          grep -q "allow_implicit_invocation" src/codex/agents/openai.yaml || { echo "❌ codex policy yaml missing/invalid"; FAIL=1; }
          if grep -q "Bash" src/claude/handoff.md; then echo "❌ Bash must not appear in claude variant"; FAIL=1; fi
          exit $FAIL

      - name: Eval matrix tracks the schema (staleness gate)
        run: |
          FAIL=0
          for m in "REVOKED" "bloqueia:" "não-idempotente" "Emergência" "Pin" "externo" "Gates ativos"; do
            grep -qi "$m" docs/EVAL.md || { echo "❌ EVAL missing coverage [$m]"; FAIL=1; }
          done
          exit $FAIL

      - name: Version equality (description × DNA comment, all 4 variants)
        run: |
          FAIL=0
          for f in src/opencode/handoff.md src/claude/handoff.md src/codex/SKILL.md src/grok/SKILL.md; do
            dv=$(grep -oE "v[0-9]+\.[0-9]+" "$f" | head -1)
            grep -q "handoff $dv" "$f" || { echo "❌ version mismatch description×DNA in $f"; FAIL=1; }
          done
          exit $FAIL

      - name: Checksums
        run: sha256sum -c CHECKSUMS.sha256 --quiet
